

<header class="main-header" dir="rtl">

  <div class="header-container">

    <!-- Logo -->
    <div class="header-logo">

      <a routerLink="/home">
        <img
          [src]="logo"
          [alt]="siteName || 'عزیزی کابینت'"
        >
      </a>

    </div>


    <!-- Navigation -->
    <nav class="header-navigation">

      <mo-navbar-menu
        [items]="menuItem">
      </mo-navbar-menu>

    </nav>


    <!-- Request Button -->
    <div class="header-action">

      <a
        routerLink="/admin/login"
        pButton
        [label]="'ADMIN_LOGIN' | translate"
        severity="secondary"
        [outlined]="true"
        [rounded]="true"
        icon="pi pi-user"
        iconPos="right"
        styleClass="admin-login-btn"
      ></a>

      <request-btn></request-btn>

    </div>

  </div>

</header>
