<section class="not-found" dir="rtl">

  <div class="container">

    <div class="not-found-inner text-center">

      <div class="not-found-code">404</div>

      <div class="not-found-line"></div>

      <h1 class="not-found-title">
        {{ 'NOT_FOUND_TITLE' | translate }}
      </h1>

      <p class="not-found-desc">
        {{ 'NOT_FOUND_DESC' | translate }}
      </p>

      <p-button
        [label]="'BACK_TO_HOME' | translate"
        icon="pi pi-home"
        iconPos="right"
        [routerLink]="['/home']"
      ></p-button>

    </div>

  </div>

</section>
