<div
  class="mo-number-wrapper"
  [class]="config.containerClass ?? ''"
  [class.is-disabled]="disabled || config.disabled"
  [class.is-readonly]="readonly"
  [class.has-error]="control?.invalid && (control?.touched || control?.dirty)"
>

  <div class="mo-number-field">

    <input
      class="mo-number-input"
      [id]="config.inputId"
      [class]="config.inputClass ?? ''"
      [ngModel]="model"
      placeholder=" "
      [disabled]="config.disabled ?? disabled"
      [readonly]="readonly"

      (ngModelChange)="changeHandler($event)"
      (blur)="onTouched()"

      OnlyNumber

      [maxlength]="config.maxLength"
      [minlength]="config.minLength"

      type="text"
      pInputText

      [CostFormatter]="config.moneySplitter"
      [MaxNumber]="config.maxValue"
    />

    <label
      class="mo-number-label"
      [class]="config.labelClass ?? ''"
      [for]="config.inputId"
    >
      {{ (config.floatLabel | translate) ?? (config.label | translate) }}

      @if (isRequired) {
        <span class="required-star">*</span>
      }
    </label>

  </div>

  <div class="mo-number-error">
    <app-form-errors [config]="errorConfig"></app-form-errors>
  </div>

</div>
