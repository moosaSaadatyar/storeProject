<div class="align-items-center bg-light d-flex header-container justify-content-between my-2 p-2 rounded shadow-sm">
    <div class="text-section">
        <h5 class="fw-bold text-dark">{{ title |transloco }}</h5>
        <p class="text-muted mb-0">{{ subTitle |transloco }}</p>
    </div>

    @if(showButton){
    <div class="action-section">
        <button class="btn btn-primary px-4" (click)="onBtnClick()">
            @if (buttonIcon) {
            <i [class]="buttonIcon + ' me-2'"></i>
            }
            {{ buttonLabel }}
        </button>
    </div>
    }
</div>
