<ng-container *ngIf='config'>
  <div
    *ngFor='let error of (config?.errors | keyvalue) ?? []; trackBy: identifyError'
    class='ps-2 cmp-error-container'>
    <small
      class='text-danger'
      *ngIf='
    config.control?.errors?.[error.key] &&
    (!(config.dirtyCheck ?? true) ||
     (config?.dirtyAndTouchedCheckControl?.dirty ??
      config.control.dirty)) &&
     (!(config.touchedCheck ?? true) ||
      (config?.dirtyAndTouchedCheckControl?.touched ??
       config.control.touched))'>
      {{error.value}}
    </small>
  </div>

</ng-container>
