@if (!loadingMode) {

  <div
    class="mo-input-wrapper"
    [class]="config?.containerClass ?? ''"
    [class.is-disabled]="disabled"
    [class.is-readonly]="readonly"
    [class.has-error]="control?.invalid && (control?.touched || control?.dirty)"
  >

    <div class="mo-input-field">

      <input
        class="mo-input"
        [id]="config.inputId"
        [class]="config.inputClass ?? ''"
        [ngModel]="model"
        [placeholder]="config.placeholder ?? ' '"
        [disabled]="disabled"
        [readonly]="readonly"
        (ngModelChange)="changeHandler($event)"
        (blur)="onTouched()"
        [type]="config.isPassword ? 'password' : 'text'"
        [maxlength]="config.maxLength"
        [minlength]="config.minLength"
        pInputText
      />

      <label
        class="mo-input-label"
        [class]="config?.labelClass ?? ''"
        [for]="config?.inputId"
      >
        {{ (config.floatLabel | translate) ?? (config.label | translate) }}

        @if (isRequired) {
          <span class="required-star">*</span>
        }
      </label>

    </div>

    <div class="mo-input-error">
      <app-form-errors [config]="errorConfig"></app-form-errors>
    </div>

  </div>

} @else {

  <div class="mo-skeleton-wrapper">
    <p-skeleton
      id="skeleton-loader"
      width="100%"
      height="3rem"
      borderRadius="10px">
    </p-skeleton>
  </div>

}
