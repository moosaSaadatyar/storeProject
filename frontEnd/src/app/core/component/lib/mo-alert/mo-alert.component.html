<div class='radius-10 position-relative fs-14 cmp-bg-warning cmp-border-right-warning'>

  <div class='px-3 py-2 card-body d-flex justify-content-between align-items-start'>
    <div class='cmp-text-warning d-flex align-items-center'>
      <i class='las la-exclamation-triangle cmp-text-warning2 pe-4 fs-46 d-none d-sm-inline'></i>

      <div class='d-flex flex-column'>

        <h4 class='cmp-text-warning fs-16 ps-2 m-0 '>
          @if(alertTitle){
          <ng-container *ngTemplateOutlet='alertTitle'>
          </ng-container>
          }@else {
          {{config.alertTitle}}
          }
        </h4>

        <span>
          @if(alertContent){
          <ng-container *ngTemplateOutlet='alertContent'>
          </ng-container>
          }@else {
          {{config.alertContent}}
          }
        </span>

      </div>
    </div>

    <i (click)='closeAlert()' id='cus-btn-close' class='las la-times-circle ms-2 fs-28 cmp-text-warning c-pointer '>
    </i>

  </div>


</div>
