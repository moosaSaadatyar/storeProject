<div [class]='{"p-inputgroup" : config.startGroup || config.endGroup}'>

  <ng-container *ngTemplateOutlet='groupRef;
     context: {$implicit: config.startGroup}'>
  </ng-container>

  <span class='d-flex flex-column h-35' [class]="config.containerClass ?? ''">
    <p-inputMask styleClass='w-100 h-35' [id]='config.inputId' [class]="config.inputClass ?? ''" [autoClear]='false'
      [showClear]='true' [ngModel]='model' [disabled]='disabled' (ngModelChange)='changeHandler($event)'
      (onBlur)='onTouched()' [mask]='config.mask' [readonly]='readonly' [maxlength]="config.maxlength"
      [minlength]="config.minlength" />
    <label class='fs-12 order' [class]='config.labelClass' [for]='config.inputId'>
      {{ (config.floatLabel |translate) ?? (config.label|translate) }}
    </label>
  </span>

  <ng-container *ngTemplateOutlet='groupRef;
     context: {$implicit: config.endGroup}'>
  </ng-container>

</div>


<div class='mt-1'>
  <app-form-errors [config]='errorConfig' />
</div>

<ng-template #groupRef let-items>

  @if (items) {
    @for (item of items; track $index) {
      <div class='p-inputgroup-addon p-0'>
        @if (item.startIcon) {
          <i [class]='item.startIcon'>
          </i>
        }
        @if (item.text) {
          <span [class]='item.startIcon'>
            {{item.text |translate}}
          </span>
        }
        @if (item.endIcon) {
          <i [class]='item.endIcon'></i>
        }

      </div>
    }
  }
</ng-template>
