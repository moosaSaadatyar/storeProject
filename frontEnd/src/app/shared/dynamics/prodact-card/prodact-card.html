<p-card styleClass="product-card">

    <ng-template pTemplate="header">
        <img
            [src]="product().imageUrl"
            [alt]="product().title"
            class="product-image">
    </ng-template>

    <div class="product-body">

        <h3 class="product-title">
            {{ product().title }}
        </h3>

        <p class="product-description">
            {{ product().description }}
        </p>

        <div class="price-wrapper">

            @if(product().oldPrice){
                <span class="old-price">
                    {{ product().oldPrice | number }}
                </span>
            }

            <span class="current-price">
                {{ product().price | number }}
                {{ 'TOMAN' | translate }}
            </span>

        </div>

        @if(product().discount){
            <p-tag
                severity="danger"
                [value]="product().discount + '%'">
            </p-tag>
        }

        @if(product().inStock){
            <p-tag
                severity="success"
                value="موجود">
            </p-tag>
        } @else {
            <p-tag
                severity="danger"
                value="ناموجود">
            </p-tag>
        }

    </div>

    <ng-template pTemplate="footer">

        <div class="actions">

            <p-button
                icon="pi pi-eye"
                label="جزئیات"
                severity="secondary"
                (onClick)="onDetails()">
            </p-button>

            <p-button
                icon="pi pi-shopping-cart"
                label="افزودن"
                (onClick)="onAddToCart()">
            </p-button>

        </div>

    </ng-template>

</p-card>
