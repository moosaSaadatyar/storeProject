<section class="steps-section py-5" dir="rtl">

  <div class="container">

    <!-- Title -->
    <div class="text-center mb-4">

      <h2 class="section-title">
        {{ 'COOPERATION_STEPS' | translate }}
      </h2>

      <p class="section-subtitle">
        {{ 'COOPERATION_STEPS_SUB' | translate }}
      </p>

      <div class="title-line"></div>

    </div>


    <!-- Steps -->
    <div class="row g-4 justify-content-center">

      @for (step of steps; track $index) {
        <div class="col-12 col-md-6 col-lg-3">

          <div class="step-item">

            <div class="step-number">
              {{ $index + 1 }}
            </div>

            <h3 class="step-title">
              {{ step.title }}
            </h3>

            @if (step.description) {
              <p class="step-description">
                {{ step.description }}
              </p>
            }

          </div>

        </div>
      }
    </div>

  </div>

</section>
