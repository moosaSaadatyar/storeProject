<section class="style-selector" dir="rtl">

  <!-- Background Image -->
  <div class="style-image">
    <img
      src="/images/s.jpg"
      alt="طراحی داخلی و کابینت"
    >
  </div>


  <div class="container position-relative">

    <div class="row justify-content-end">

      <div class="col-12 col-lg-8">

        <!-- Title -->
        <div class="text-center mb-4">

          <h2 class="style-title">
            {{ 'CHOOSE_YOUR_FAVORITE_STYLE' | translate }}
          </h2>

          <div class="title-line"></div>

        </div>


        <!-- Styles -->
        <div class="row g-3 justify-content-center">

          <!-- Modern -->
          <div class="col-12 col-sm-4">

            <button
              type="button"
              class="style-card">

              <div class="style-icon">
                <i class="pi pi-home"></i>
              </div>

              <h3>
                {{ 'MODERN' | translate }}
              </h3>

            </button>

          </div>


          <!-- Neoclassical -->
          <div class="col-12 col-sm-4">

            <button
              type="button"
              class="style-card">

              <div class="style-icon">
                <i class="pi pi-building"></i>
              </div>

              <h3>
                {{ 'NEOCLASSICAL' | translate }}
              </h3>

            </button>

          </div>


          <!-- Classic -->
          <div class="col-12 col-sm-4">

            <button
              type="button"
              class="style-card">

              <div class="style-icon">
                <i class="pi pi-th-large"></i>
              </div>

              <h3>
                {{ 'CLASSIC' | translate }}
              </h3>

            </button>

          </div>

        </div>


        <!-- Start Request -->
        <div class="text-center mt-3">

          <a
            routerLink="/request"
            class="start-request">

            <span>
              {{ 'START_REQUEST' | translate }}
            </span>

            <i class="pi pi-angle-left"></i>

          </a>

        </div>

      </div>

    </div>

  </div>

</section>
