<div class="row">
    @for (product of products; track $index) {
    <div class="col-6 col-sm-6 col-md-4 col-lg-3 col-xl-3 col-xxl-2">
        <app-product-card [product]="product" (detailsClick)="openDetails($event)" (addToCartClick)="addToCart($event)">
        </app-product-card>
    </div>
    }
</div>
