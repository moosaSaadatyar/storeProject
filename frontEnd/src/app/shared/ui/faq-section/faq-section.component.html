<section class="faq-section py-5" dir="rtl">

  <div class="container">

    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">

        <!-- Title -->
        <div class="text-center mb-4">

          <h2 class="section-title">
            {{ 'FAQ' | translate }}
          </h2>

          <p class="section-subtitle">
            {{ 'FAQ_SUB' | translate }}
          </p>

          <div class="title-line"></div>

        </div>


        <!-- Loading -->
        @if (loading) {
          <div class="d-flex flex-column gap-2">
            @for (i of [1, 2, 3]; track i) {
              <p-skeleton height="52px" borderRadius="10px"></p-skeleton>
            }
          </div>
        }


        <!-- FAQ List -->
        @if (!loading && faqs.length > 0) {
          <div class="faq-list">

            @for (faq of faqs; track faq._id; let i = $index) {
              <div class="faq-item" [class.active]="activeIndex === i">

                <button type="button" class="faq-question" (click)="toggle(i)">
                  <span>{{ faq.question }}</span>
                  <i class="pi" [class.pi-chevron-down]="activeIndex !== i" [class.pi-chevron-up]="activeIndex === i"></i>
                </button>

                @if (activeIndex === i) {
                  <div class="faq-answer">
                    {{ faq.answer }}
                  </div>
                }

              </div>
            }
          </div>
        }

      </div>
    </div>

  </div>

</section>
